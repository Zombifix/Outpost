server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression : divise par ~4 le poids transféré.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # Les fichiers de /assets/ portent un hash dans leur nom : ils ne changent
    # jamais à contenu identique, on peut les mettre en cache indéfiniment.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html ne doit jamais être mis en cache, sinon le navigateur continue
    # de réclamer les anciens bundles après un déploiement.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Application monopage : toute route inconnue retombe sur index.html,
    # c'est le routeur côté navigateur qui décide quoi afficher.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # En-têtes de sécurité de base.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
